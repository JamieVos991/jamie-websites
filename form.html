<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Vos Creative Studio - Formulier</title>
  <meta name="description" content="Vos Creative Studio ontwerpt toegankelijke, gebruiksvriendelijke websites voor iedereen. Van startplan tot premium, inclusief onderhoud, SEO en interactieve elementen.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles/styleguide.css" />
  <link rel="stylesheet" href="styles/form.css">
  
  <!-- Scripts -->
  <script type="module" src="./scripts/script.js"></script>
</head>
  <body>
    <main>
      <form id="contactForm">
        <label>
          Email
          <input type="email" name="email" required />
        </label>

        <label>
          Naam
          <input type="text" name="name" required />
        </label>

        <p>Kies een plan</p>

        <label>
          <input type="radio" name="plan" value="Basis" required />
          Basis
        </label>

        <label>
          <input type="radio" name="plan" value="Standaard" />
          Standaard
        </label>

        <label>
          <input type="radio" name="plan" value="Premium" />
          Premium
        </label>

        <button type="submit">Verstuur</button>
      </form>

      <script src="./scripts/form.js"></script>
    </main>
  </body>
</html>
