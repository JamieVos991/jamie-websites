<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Vos Creative Studio - Formulier</title>
    <meta
      name="description"
      content="Vos Creative Studio ontwerpt toegankelijke, gebruiksvriendelijke websites voor iedereen. Van startplan tot premium, inclusief onderhoud, SEO en interactieve elementen."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="styles/styleguide.css" />
    <link rel="stylesheet" href="styles/form.css" />

    <!-- Scripts -->
    <script type="module" src="scripts/form.js"></script>
  </head>
  <body>
    <main>
      <form id="contact-form">
        <!-- Persoonlijke info -->
        <fieldset>
          <legend>
            Vul hier je persoonlijke contactgegevens in zodat we je kunnen
            bereiken
          </legend>

          <label class="label-required" for="naam">Naam</label>
          <input id="naam" type="text" name="name" required />

          <label class="label-required" for="email">E-mail</label>
          <input id="email" type="email" name="email" required />

          <label class="label-required" for="telefoon">Telefoon</label>
          <input id="telefoon" type="tel" name="phone" />
        </fieldset>

        <!-- Bedrijf & huidige website -->
        <fieldset>
          <legend>
            Vertel ons meer over jou, je bedrijf en je huidige online
            aanwezigheid
          </legend>

          <label for="bedrijf">Bedrijf / Organisatie</label>
          <input id="bedrijf" type="text" name="company" />

          <label for="website">Huidige website</label>
          <input id="website" type="url" name="currentWebsite" />

          <label for="opmerkingen">Opmerkingen / extra info</label>
          <textarea
            id="opmerkingen"
            name="message"
            rows="4"
            placeholder="Laat hier je opmerkingen achter..."
          ></textarea>

          <label for="bron">Hoe heb je ons gevonden?</label>
          <select id="bron" name="source">
            <option value="">Selecteer</option>
            <option value="Google">Google</option>
            <option value="Social Media">Social media</option>
            <option value="Aanbeveling">Aanbeveling</option>
            <option value="Anders">Anders</option>
          </select>
        </fieldset>

        <!-- Plan selectie -->
        <fieldset>
          <legend>
            Kies het pakket dat het beste past bij jouw wensen en doelen
          </legend>
          <label>
            <input type="radio" name="plan" value="Basis" required />
            Start
          </label>

          <label>
            <input type="radio" name="plan" value="Standaard" />
            Standaard
          </label>

          <label>
            <input type="radio" name="plan" value="Premium" />
            Premium
          </label>
        </fieldset>

        <button type="submit">Verstuur</button>
      </form>
    </main>

    <div id="loader-overlay" class="loader-overlay">
      <div class="spinner"></div>
      <p>Je aanvraag wordt verzonden...</p>
    </div>
  </body>
</html>
